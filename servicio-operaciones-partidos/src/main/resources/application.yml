server:
  port: 8082

spring:
  application:
    name: servicio-operaciones-partidos
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/fulvo_db?currentSchema=esquema_operaciones
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: esquema_operaciones
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8090/realms/fulvo-realm/protocol/openid-connect/certs}

management:
  endpoints:
    web:
      base-path: /
      path-mapping:
        health: health-check
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    level: "%5p [%X{correlationId}]"

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha

geocodificacion:
  base-url: http://localhost:8084
  connect-timeout-ms: 2000
  read-timeout-ms: 7000

torneos:
  base-url: ${TORNEOS_BASE_URL:http://localhost:8081}
  connect-timeout-ms: 2000
  read-timeout-ms: 5000
