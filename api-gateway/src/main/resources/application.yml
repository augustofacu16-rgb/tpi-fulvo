server:
  port: 8080

spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8090/realms/fulvo-realm/protocol/openid-connect/certs}

management:
  endpoints:
    web:
      base-path: /
      path-mapping:
        health: health-check
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

services:
  torneos:
    url: ${SERVICES_TORNEOS_URL:http://localhost:8081}
  operaciones:
    url: ${SERVICES_OPERACIONES_URL:http://localhost:8082}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{correlationId}] %logger{36} - %msg%n"
  level:
    root: INFO
    com.fulvo: DEBUG
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO
