services:
  # Base de Datos Relacional PostgreSQL 16
  postgres-db:
    image: postgres:16-alpine
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fulvo_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${DB_PORT_HOST:-5432}:5432"
    volumes:
      - ./initdb/init-schemas.sql:/docker-entrypoint-initdb.d/01-init-schemas.sql:ro
      - ./initdb/seed-torneos-test.sql:/docker-entrypoint-initdb.d/02-seed-torneos-test.sql:ro
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bda-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fulvo_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Servidor de Identidad OIDC / OAuth2 Keycloak 26.5.0
  keycloak-server:
    image: quay.io/keycloak/keycloak:26.5.0
    container_name: keycloak-server
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: 8090
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT_HOST:-8090}:8090"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    networks:
      - bda-net
    depends_on:
      postgres-db:
        condition: service_healthy

  # Servidor SMTP Mock y Bandeja de Visualización de Correos Mailpit
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # Servidor SMTP para microservicio notificaciones
      - "${MAILPIT_WEB_PORT:-8025}:8025" # Interfaz Web para visualización de emails
    networks:
      - bda-net

  # Servidor Mock WireMock para Contingencia Offline (OSM y Open-Meteo)
  wiremock:
    image: wiremock/wiremock:3.9.1
    container_name: wiremock
    restart: unless-stopped
    ports:
      - "${WIREMOCK_PORT_HOST:-8086}:8080" # WireMock expuesto en puerto del host
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings:ro
    networks:
      - bda-net

networks:
  bda-net:
    name: bda-net
    driver: bridge

volumes:
  postgres_data:
